# ============================================================
# 로컬 개발용 compose: PostgreSQL + backend(FastAPI) + dashboard(nginx 정적 React)
# ------------------------------------------------------------
#   cp .env.example .env   # NVIDIA_API_KEY, APP_PASSWORD 채우기
#   docker compose up -d --build
#   http://localhost:8501  (대시보드)   http://localhost:8000/docs  (API 문서)
# 프론트만 고칠 때는 `cd dashboard && npm run dev` (5173, /api 를 localhost:8000 으로 넘긴다)
# ============================================================
services:
  postgres:
    image: postgres:17
    container_name: kf-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      POSTGRES_DB: ${POSTGRES_DB:-crypto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crypto}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 스키마(backend/schema.sql)는 backend 가 기동할 때 스스로 만든다.
  backend:
    build: ./backend
    container_name: kf-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crypto}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crypto}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NIM_MODEL: ${NIM_MODEL:-}
      NIM_FALLBACK_MODEL: ${NIM_FALLBACK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      APP_PASSWORD: ${APP_PASSWORD:-}

  dashboard:
    build: ./dashboard
    container_name: kf-dashboard
    depends_on:
      - backend
    ports:
      - "8501:80"

volumes:
  pgdata:
