# ============================================================
# CD: 테스트 통과 -> 이미지 빌드(amd64 + arm64) -> GHCR push
# ------------------------------------------------------------
# main 에 push 될 때마다 돈다 (경로 필터 없음: oracle_vm 자동배포가 커밋마다 build-and-push 체크를 기다린다).
#   1) test           : backend 유닛 테스트 + dashboard 타입 검사·빌드. 실패하면 이미지를 만들지 않는다.
#   2) build-and-push : backend, dashboard 이미지를 ghcr.io/<owner>/<repo>-<서비스>:{latest, sha-xxxxxxx} 로 push
# oracle_vm 의 infra/kaspflow-autodeploy.sh 는 이름이 "build-and-push" 로 시작하는 체크가 전부 success 인
# 커밋만 배포한다. test 가 실패하면 build-and-push 가 skipped 가 되어 배포되지 않는다.
# 인증: 기본 GITHUB_TOKEN (packages: write). 별도 시크릿 없음.
# ============================================================
name: Publish Images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: backend 유닛 테스트
        working-directory: backend
        run: pip install -r requirements.txt && python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json
      - name: dashboard 타입 검사 + 빌드
        working-directory: dashboard
        run: npm ci && npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: dashboard
            context: ./dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # oracle_vm 이 ARM(aarch64)이라 arm64 이미지가 필요하다. dashboard 의 빌드 단계는 네이티브 플랫폼에서 돈다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
