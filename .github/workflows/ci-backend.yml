# ============================================================
# CI: backend (FastAPI 주식 검증기)
#   - 유닛 테스트: 계량(지표·전략·엔진·검증기·시뮬레이션), 재무·밸류에이션, 뉴스·투자 대가·판단 엔진,
#     LLM 클라이언트(httpx MockTransport), 파이프라인(가짜 LLM), API(인증·SSE·적중률)
#   - DB 통합 테스트: postgres:17 서비스 위에서 schema.sql, 캐시 TTL, 실행 기록 저장
#   - 운영 이미지 안에서 import 검사 (Dockerfile COPY 누락 방지, 2026-10-17 장애 재발 방지)
# 네트워크(야후·NIM)는 쓰지 않는다.
# ============================================================
name: CI Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 유닛 + DB 통합 테스트
        run: python -m unittest discover -s tests -v
      - name: 운영 이미지 import 검사
        run: |
          docker build -q -t backend-ci .
          docker run --rm backend-ci python -c "import app, pipeline; print('backend image import OK')"
