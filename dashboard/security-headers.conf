# 화면(HTML·JS·CSS)에 붙이는 보안 헤더. OWASP Secure Headers Project 권장값을 이 앱에 맞춘 것.
# nginx 는 location 에 add_header 가 하나라도 있으면 server 의 add_header 를 물려받지 않으므로, location 마다 이 파일을 include 한다.
#   script-src 'self'        : 인라인 스크립트 금지 (테마 스크립트는 /theme.js 로 뺐다)
#   style-src 'unsafe-inline': 차트가 위치·크기를 style 속성으로 넣는다 (스크립트와 달리 위험이 작다)
#   img-src data:            : 파비콘이 data: SVG 다
#   connect-src 'self'       : /api (fetch, 실행 화면의 EventSource)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
