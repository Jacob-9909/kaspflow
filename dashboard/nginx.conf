# nginx 설정: React 정적 파일 서빙 + /api 를 backend로 프록시
# ------------------------------------------------------------
# 이 구성 덕분에 브라우저는 대시보드(8501)와 API를 "같은 출처"로 보게 되어
# CORS 설정 없이도 프론트엔드가 백엔드를 호출할 수 있다.
server {
    listen 80;
    server_name _;

    # 1) 정적 파일(빌드된 React 앱) 서빙
    root /usr/share/nginx/html;
    index index.html;

    # /api/* 요청은 backend 컨테이너(FastAPI, 8000)로 전달.
    #   - /api 접두사는 그대로 두지 않고 제거해서 넘긴다:
    #     /api/ohlc -> http://backend:8000/ohlc
    #   - resolver: docker 내부 DNS(127.0.0.11)로 backend 이름을 실행 시점에 해석
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2) SPA 라우팅 지원: 어떤 경로로 들어와도 index.html 반환
    #    (지금은 단일 페이지라 필수는 아니지만, 라우터 추가 대비)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
