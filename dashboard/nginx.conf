# nginx: React 정적 파일 + /api 를 backend 로 프록시 (같은 출처라 CORS 가 필요 없다)
# 운영에서는 Caddy 가 /api 를 backend 로 바로 보내고, 이 nginx 는 정적 파일만 서빙한다.
# 로컬 compose 나 8501 직접 접속에서는 이 프록시를 쓴다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api/analyze 는 SSE(서버 전송 이벤트) 스트림이다. 버퍼링을 끄고 오래 기다린다.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 해시가 붙은 빌드 산출물(폰트 조각 포함)은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
