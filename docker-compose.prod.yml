# ============================================================
# 프로덕션 compose (oracle_vm 배포용): backend + dashboard 두 개만
# ------------------------------------------------------------
# 로컬 docker-compose.yml 과 다른 점
#   1) 이미지를 GHCR 에서 받는다 (publish-images 워크플로가 커밋마다 :sha-xxxxxxx 로 올림)
#   2) postgres 컨테이너가 없다. VM 의 네이티브 PostgreSQL 17 (crypto DB, stock 스키마)을 쓴다
#   3) 포트는 127.0.0.1 에만 연다. 바깥에서는 Caddy(443) 로만 들어온다 (예전 8501 평문 노출 제거)
# 2026-11-16 재설계: 코인 실시간 파이프라인(kafka, kafka-ui, producer, spark, news-collector,
#   signal-worker)을 내렸다. 남은 컨테이너는 자동배포의 `up -d --remove-orphans` 가 정리한다.
#
# .env (VM 에만, git 커밋 금지. 값 뒤에 # 주석을 달지 말 것)
#   IMAGE_PREFIX=ghcr.io/jacob-9909/kaspflow
#   BACKEND_HOST_PORT=8010          (8000 은 midas-touch 가 쓴다. Caddy 의 /api 업스트림과 같아야 함)
#   POSTGRES_HOST=host.docker.internal / POSTGRES_PORT / POSTGRES_DB=crypto / POSTGRES_USER=crypto / POSTGRES_PASSWORD
#   NVIDIA_API_KEY, NVIDIA_API_KEY_2  (midas-touch/.env 의 키를 복사)
#   APP_PASSWORD                      (실행 버튼 비밀번호)
#   SESSION_SECRET                    (로그인 쿠키 서명 키, openssl rand -hex 32)
# ============================================================
services:
  backend:
    image: ${IMAGE_PREFIX}-backend:${IMAGE_TAG:-latest}
    container_name: backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-crypto}
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_KEY_2: ${NVIDIA_API_KEY_2:-}
      NIM_MODEL: ${NIM_MODEL:-}
      NIM_FALLBACK_MODEL: ${NIM_FALLBACK_MODEL:-nvidia/nemotron-3.5-lightning-30b-a3b}
      NIM_RPM: ${NIM_RPM:-40}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-2}
    # 분석 1회 피크 ~300MB (10년 일봉 x 30개 변형 + 몬테카를로 2,000경로). 동시 2회 + 여유.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}

  dashboard:
    image: ${IMAGE_PREFIX}-dashboard:${IMAGE_TAG:-latest}
    container_name: dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8501:80"
    mem_limit: 128m
