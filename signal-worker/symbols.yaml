# 종목 별칭 사전 (signal-worker 의 종목 매칭 + Laya 질문에 쓰는 코인 이름)
# 설계: docs/news-signal-design.md 4.2절
#
# 규칙
#   - 별칭은 단어 경계로만 찾는다: 'BTC' 는 'BTCUSD' 나 'abtc' 에는 걸리지 않는다.
#   - 전부 대문자이고 5자 이하인 별칭(BTC, ETH, XRP)은 대소문자를 구분한다. 나머지(Bitcoin, Ethereum...)는 구분하지 않는다.
#   - exclude 의 구문은 매칭 전에 본문에서 지운다. ('Bitcoin Cash' 기사가 Bitcoin 으로 잡히는 것을 막는다)
#   - name 은 Laya 질문 문장에 들어가는 이름이다. 영어 소스뿐이라 한국어 별칭은 아직 넣지 않았다.
#   - 종목을 늘리려면 여기에 추가하면 된다 (SYMBOLS 와 같은 키).
symbols:
  BTCUSDT:
    name: "Bitcoin (BTC)"
    aliases: [BTC, Bitcoin]
    exclude: ["Bitcoin Cash", "Bitcoin SV", "Bitcoin Gold"]
  ETHUSDT:
    name: "Ethereum (ETH)"
    aliases: [ETH, Ethereum, Ether]
    exclude: ["Ethereum Classic"]
  XRPUSDT:
    name: "XRP"
    aliases: [XRP, Ripple]
    exclude: []

# 시장 전체 기사(MARKET)를 가리키는 가상 심볼의 표시 이름
market:
  symbol: MARKET
  name: "the overall crypto market"
